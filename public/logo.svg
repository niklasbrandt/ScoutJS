<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0f131a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="logo-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.75" />
    </linearGradient>

    <!-- Pipeline Pulse Gradient -->
    <linearGradient id="logo-stream-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Badge -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#logo-bg-grad)" stroke="url(#logo-border-grad)" stroke-width="2.5" />

  <!-- Radar / Ambient Ring -->
  <circle cx="60" cy="60" r="38" stroke="#566276" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4" />
  <circle cx="60" cy="60" r="24" fill="url(#logo-glow)" />

  <!-- Modern Geometric Pipeline Node Icon -->
  <g transform="translate(60, 60)">
    <!-- Interconnected Pipeline Geometric Nodes -->
    <path d="M -26,-12 L -6,-28 C -3,-30 3,-30 6,-28 L 26,-12 C 29,-10 29,-5 26,-3 L 6,13 C 3,15 -3,15 -6,13 L -26,-3 C -29,-5 -29,-10 -26,-12 Z" 
          fill="none" stroke="url(#logo-stream-grad)" stroke-width="3" stroke-linejoin="round" />

    <path d="M -26,8 L -6,24 C -3,26 3,26 6,24 L 26,8" 
          fill="none" stroke="url(#logo-stream-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

    <!-- Center Pulse Prism Core -->
    <polygon points="0,-9 9,0 0,9 -9,0" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />

    <!-- Pipeline Signal Satellites -->
    <circle cx="-16" cy="-20" r="2.5" fill="#818cf8" />
    <circle cx="16" cy="-20" r="2.5" fill="#34d399" />
  </g>
</svg>
